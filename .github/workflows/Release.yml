name: Auto Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -e

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag: '${LATEST_TAG}'"

          if [ -z "$LATEST_TAG" ]; then
            # 首次发布
            NEW_VERSION="1.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch|*) PATCH=$((PATCH + 1)) ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "New version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Patch gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ steps.version.outputs.version }}/" gradle.properties
          grep '^mod_version' gradle.properties

      - name: Build
        run: gradle build --no-daemon

      - name: List built jars
        run: ls -la build/libs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Boxed ${{ steps.version.outputs.tag }}"
          body: |
            ## Boxed ${{ steps.version.outputs.tag }}

            自动构建产物，适用于 **Minecraft 1.21.5 + Fabric**。

            ### 依赖
            - Fabric Loader ≥ 0.19.3
            - Fabric API
            - Java 21

            ### 安装
            1. 下载 `boxed-${{ steps.version.outputs.version }}.jar`
            2. 放入 `.minecraft/mods/`
            3. 确保已安装 Fabric API

            ### 包含内容
            - 盒装刷铁机（空 / 僵尸 / 村民 / 完整）
            - 盒装刷线机
            - 精准采集保留状态、普通破坏掉落空盒
            - 8 格内阻止睡眠
          files: |
            build/libs/boxed-${{ steps.version.outputs.version }}.jar
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}